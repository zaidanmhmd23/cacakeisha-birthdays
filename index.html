<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Gesture Particle Control</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #050505;
        font-family: Arial, sans-serif;
      }
      #webcam {
        position: absolute;
        bottom: 20px;
        left: 20px;
        width: 180px;
        height: 135px;
        border: 2px solid #00ffcc;
        border-radius: 8px;
        transform: scaleX(-1);
        z-index: 10;
        background-color: #111;
      }
      #error-msg {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #ff4444;
        background: rgba(0, 0, 0, 0.8);
        padding: 20px;
        border-radius: 10px;
        font-size: 16px;
        display: none;
        text-align: center;
        z-index: 100;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="error-msg">
      ⚠️ Kamera tidak terdeteksi atau izin akses kamera ditolak!<br />Mohon
      izinkan akses kamera pada browser Anda.
    </div>

    <video id="webcam" autoplay playsinline muted></video>

    <script>
      const PARTICLE_COUNT = 8000;
      let scene, camera, renderer, particles, geometry;
      let currentPositions = new Float32Array(PARTICLE_COUNT * 3);
      let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
      let currentColors = new Float32Array(PARTICLE_COUNT * 3);
      let targetColors = new Float32Array(PARTICLE_COUNT * 3);

      let activeShapeIndex = 0;

      function getCloudPositions() {
        const pos = new Float32Array(PARTICLE_COUNT * 3);
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          pos[i * 3] = (Math.random() - 0.5) * 15;
          pos[i * 3 + 1] = (Math.random() - 0.5) * 15;
          pos[i * 3 + 2] = (Math.random() - 0.5) * 15;
        }
        return pos;
      }

      function getBalloonPositions() {
        const pos = new Float32Array(PARTICLE_COUNT * 3);
        const balloonCount = 5;
        const balloonParticles = Math.floor(PARTICLE_COUNT * 0.6); // 60% for balloons
        const starParticles = PARTICLE_COUNT - balloonParticles; // 40% for stars
        const particlesPerBalloon = Math.floor(balloonParticles / balloonCount);
        
        // Balloon centers
        const balloonCenters = [
          { x: 0, y: 2, z: 0 },
          { x: -2, y: 1, z: 1 },
          { x: 2, y: 1, z: -1 },
          { x: -1, y: 0, z: -1 },
          { x: 1, y: 0, z: 1 }
        ];
        
        // Balloon colors
        const balloonColors = [
          { r: 1.0, g: 0.2, b: 0.4 },    // Pink
          { r: 0.2, g: 0.6, b: 1.0 },    // Blue
          { r: 1.0, g: 0.8, b: 0.2 },    // Yellow
          { r: 0.4, g: 1.0, b: 0.4 },    // Green
          { r: 1.0, g: 0.4, b: 0.6 }     // Pink
        ];
        
        // Create balloons
        for (let i = 0; i < balloonParticles; i++) {
          const balloonIndex = Math.floor(i / particlesPerBalloon);
          const center = balloonCenters[balloonIndex % balloonCount];
          
          // Create balloon shape (sphere)
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.random() * Math.PI;
          const radius = 1.2 + Math.random() * 0.1;
          
          // Balloon body (elongated sphere)
          const stretch = 1.3;
          pos[i * 3] = center.x + radius * Math.sin(phi) * Math.cos(theta) * stretch;
          pos[i * 3 + 1] = center.y + radius * Math.cos(phi) * stretch * 1.2;
          pos[i * 3 + 2] = center.z + radius * Math.sin(phi) * Math.sin(theta);
          
          // Add some particles for balloon strings
          if (Math.random() < 0.1) {
            pos[i * 3] = center.x + (Math.random() - 0.5) * 0.1;
            pos[i * 3 + 1] = center.y - 1.5 - Math.random() * 2;
            pos[i * 3 + 2] = center.z + (Math.random() - 0.5) * 0.1;
          }
        }
        
        // Create stars scattered around
        for (let i = balloonParticles; i < PARTICLE_COUNT; i++) {
          // Random position in a sphere around the balloons
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.random() * Math.PI;
          const radius = 3 + Math.random() * 4; // Stars spread out around balloons
          
          pos[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
          pos[i * 3 + 1] = radius * Math.cos(phi) + 1; // Offset up a bit
          pos[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
        }
        
        return pos;
      }

      function getUranusPositions() {
        const pos = new Float32Array(PARTICLE_COUNT * 3);
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          if (i < PARTICLE_COUNT * 0.45) {
            const u = Math.random() * Math.PI * 2;
            const v = Math.random() * Math.PI;
            const r = 2.5;
            pos[i * 3] = r * Math.sin(v) * Math.cos(u);
            pos[i * 3 + 1] = r * Math.sin(v) * Math.sin(u);
            pos[i * 3 + 2] = r * Math.cos(v);
          } else {
            const theta = Math.random() * Math.PI * 2;
            const r = 3.8 + Math.random() * 2.8;
            pos[i * 3] = r * Math.cos(theta);
            pos[i * 3 + 1] = (Math.random() - 0.5) * 0.25;
            pos[i * 3 + 2] = r * Math.sin(theta);
          }
        }
        return pos;
      }

      function getTextPositions(text = "I LOVE YOU") {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 1000;
        canvas.height = 120;

        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.font = "bold 50px Arial";
        ctx.textAlign = "center";
        ctx.fillText(text, 500, 75);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const validPixels = [];

        for (let y = 0; y < canvas.height; y += 2) {
          for (let x = 0; x < canvas.width; x += 2) {
            const index = (y * canvas.width + x) * 4;
            if (imgData.data[index] > 128) {
              validPixels.push({
                x: (x - canvas.width / 2) * 0.03,
                y: -(y - canvas.height / 2) * 0.03,
              });
            }
          }
        }

        const pos = new Float32Array(PARTICLE_COUNT * 3);
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const pt = validPixels[i % validPixels.length];
          pos[i * 3] = pt.x + (Math.random() - 0.5) * 0.03;
          pos[i * 3 + 1] = pt.y + (Math.random() - 0.5) * 0.03;
          pos[i * 3 + 2] = (Math.random() - 0.5) * 0.1;
        }
        return pos;
      }

      function getCloudColors() {
        const col = new Float32Array(PARTICLE_COUNT * 3);
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          col[i * 3] = 0.2 + Math.random() * 0.8;
          col[i * 3 + 1] = 0.2 + Math.random() * 0.8;
          col[i * 3 + 2] = 0.5 + Math.random() * 0.5;
        }
        return col;
      }

      function getBalloonColors() {
        const col = new Float32Array(PARTICLE_COUNT * 3);
        const balloonCount = 5;
        const balloonParticles = Math.floor(PARTICLE_COUNT * 0.6); // 60% for balloons
        const starParticles = PARTICLE_COUNT - balloonParticles; // 40% for stars
        const particlesPerBalloon = Math.floor(balloonParticles / balloonCount);
        
        // Balloon colors
        const balloonColors = [
          { r: 1.0, g: 0.2, b: 0.4 },    // Pink
          { r: 0.2, g: 0.6, b: 1.0 },    // Blue
          { r: 1.0, g: 0.8, b: 0.2 },    // Yellow
          { r: 0.4, g: 1.0, b: 0.4 },    // Green
          { r: 1.0, g: 0.4, b: 0.6 }     // Pink
        ];
        
        // Create balloon colors
        for (let i = 0; i < balloonParticles; i++) {
          const balloonIndex = Math.floor(i / particlesPerBalloon);
          const color = balloonColors[balloonIndex % balloonCount];
          
          // Add some color variation
          col[i * 3] = color.r + (Math.random() - 0.5) * 0.1;
          col[i * 3 + 1] = color.g + (Math.random() - 0.5) * 0.1;
          col[i * 3 + 2] = color.b + (Math.random() - 0.5) * 0.1;
          
          // String particles are white/grey
          if (Math.random() < 0.1) {
            col[i * 3] = 0.8 + Math.random() * 0.2;
            col[i * 3 + 1] = 0.8 + Math.random() * 0.2;
            col[i * 3 + 2] = 0.8 + Math.random() * 0.2;
          }
        }
        
        // Create star colors (yellow/white with sparkle)
        for (let i = balloonParticles; i < PARTICLE_COUNT; i++) {
          // Random star colors: mostly yellow and white
          const starType = Math.random();
          if (starType < 0.6) {
            // Yellow stars
            col[i * 3] = 1.0;
            col[i * 3 + 1] = 0.9 + Math.random() * 0.1;
            col[i * 3 + 2] = 0.2 + Math.random() * 0.3;
          } else if (starType < 0.8) {
            // White stars
            col[i * 3] = 0.9 + Math.random() * 0.1;
            col[i * 3 + 1] = 0.9 + Math.random() * 0.1;
            col[i * 3 + 2] = 1.0;
          } else {
            // Golden sparkles
            col[i * 3] = 1.0;
            col[i * 3 + 1] = 0.7 + Math.random() * 0.3;
            col[i * 3 + 2] = 0.0;
          }
        }
        
        return col;
      }

      function getUranusColors() {
        const col = new Float32Array(PARTICLE_COUNT * 3);
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          if (i < PARTICLE_COUNT * 0.45) {
            col[i * 3] = 0.35 + Math.random() * 0.15;
            col[i * 3 + 1] = 0.85 + Math.random() * 0.15;
            col[i * 3 + 2] = 0.9 + Math.random() * 0.1;
          } else {
            col[i * 3] = 0.25 + Math.random() * 0.15;
            col[i * 3 + 1] = 0.75 + Math.random() * 0.2;
            col[i * 3 + 2] = 0.85 + Math.random() * 0.15;
          }
        }
        return col;
      }

      function getTextColor() {
        const col = new Float32Array(PARTICLE_COUNT * 3);
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          col[i * 3] = 0.0;
          col[i * 3 + 1] = 1.0;
          col[i * 3 + 2] = 0.8;
        }
        return col;
      }

      function getKeishaColor() {
        const col = new Float32Array(PARTICLE_COUNT * 3);
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const t = i / PARTICLE_COUNT;
          // Gradasi dari pink muda ke pink gelap
          col[i * 3] = 1.0;
          col[i * 3 + 1] = 0.4 + t * 0.4;
          col[i * 3 + 2] = 0.5 + t * 0.5;
        }
        return col;
      }

      const shapes = [
        getCloudPositions(),
        getBalloonPositions(),
        getTextPositions("KEISHA NATANIA S.I.Kom"),
        getTextPositions("HAPPY BIRTHDAY"),
        getTextPositions("WISH U ALL THE BEST"),
      ];

      const shapeColors = [
        getCloudColors(),
        getBalloonColors(),
        getKeishaColor(),
        getTextColor(),
        getTextColor(),
      ];

      function initThreeJS() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(
          60,
          window.innerWidth / window.innerHeight,
          0.1,
          1000,
        );
        camera.position.z = 12;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        geometry = new THREE.BufferGeometry();
        const initialPos = shapes[0];
        const initialCol = shapeColors[0];

        for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
          currentPositions[i] = initialPos[i];
          targetPositions[i] = initialPos[i];
          currentColors[i] = initialCol[i];
          targetColors[i] = initialCol[i];
        }

        geometry.setAttribute(
          "position",
          new THREE.BufferAttribute(currentPositions, 3),
        );
        geometry.setAttribute(
          "color",
          new THREE.BufferAttribute(currentColors, 3),
        );

        const material = new THREE.PointsMaterial({
          size: 0.06,
          vertexColors: true,
          blending: THREE.AdditiveBlending,
          transparent: true,
          opacity: 0.85,
        });

        particles = new THREE.Points(geometry, material);
        scene.add(particles);

        window.addEventListener("resize", onWindowResize);
        animate();
      }

      function setShape(shapeIndex) {
        if (activeShapeIndex === shapeIndex) return;
        activeShapeIndex = shapeIndex;

        const targetPos = shapes[shapeIndex];
        const targetCol = shapeColors[shapeIndex];

        for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
          targetPositions[i] = targetPos[i];
          targetColors[i] = targetCol[i];
        }
      }

      function animate() {
        requestAnimationFrame(animate);

        const positions = geometry.attributes.position.array;
        const colorsAttr = geometry.attributes.color.array;

        for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
          positions[i] += (targetPositions[i] - positions[i]) * 0.1;
          colorsAttr[i] += (targetColors[i] - colorsAttr[i]) * 0.1;
        }
        geometry.attributes.position.needsUpdate = true;
        geometry.attributes.color.needsUpdate = true;

        if (activeShapeIndex === 3) {
          particles.rotation.x = THREE.MathUtils.lerp(
            particles.rotation.x,
            0,
            0.1,
          );
          particles.rotation.y = THREE.MathUtils.lerp(
            particles.rotation.y,
            0,
            0.1,
          );
          particles.rotation.z = THREE.MathUtils.lerp(
            particles.rotation.z,
            0,
            0.1,
          );
        } else if (activeShapeIndex === 1) {
          // Balloons - gentle floating motion
          particles.rotation.y += 0.003;
          particles.rotation.x = Math.sin(Date.now() * 0.001) * 0.01;
          particles.rotation.z = Math.cos(Date.now() * 0.001) * 0.01;
        } else if (activeShapeIndex === 2) {
          particles.rotation.y += 0.012;
          particles.rotation.x += 0.008;
          particles.rotation.z += 0.003;
        } else {
          particles.rotation.y += 0.005;
        }

        renderer.render(scene, camera);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function detectGesture(landmarks) {
        const isIndexOpen = landmarks[8].y < landmarks[6].y;
        const isMiddleOpen = landmarks[12].y < landmarks[10].y;
        const isRingOpen = landmarks[16].y < landmarks[14].y;
        const isPinkyOpen = landmarks[20].y < landmarks[18].y;

        // 1 jari → HAPPY BIRTHDAY
        if (isIndexOpen && !isMiddleOpen && !isRingOpen && !isPinkyOpen) {
          return 3;
        }

        // 2 jari → KEISHA NATANIA S.I.Kom
        if (isIndexOpen && isMiddleOpen && !isRingOpen && !isPinkyOpen) {
          return 2;
        }

        // 3 jari → WISH U ALL THE BEST
        if (isIndexOpen && isMiddleOpen && isRingOpen && !isPinkyOpen) {
          return 4;
        }

        // 0 jari → BALLOONS
        if (!isIndexOpen && !isMiddleOpen && !isRingOpen && !isPinkyOpen) {
          return 1;
        }

        // 4 jari → CLOUD
        if (isIndexOpen && isMiddleOpen && isRingOpen && isPinkyOpen) {
          return 0;
        }

        return activeShapeIndex;
      }

      function onResults(results) {
        if (
          results.multiHandLandmarks &&
          results.multiHandLandmarks.length > 0
        ) {
          const shapeIndex = detectGesture(results.multiHandLandmarks[0]);
          setShape(shapeIndex);
        }
      }

      const videoElement = document.getElementById("webcam");
      const errorMsg = document.getElementById("error-msg");

      initThreeJS();

      const hands = new Hands({
        locateFile: (file) =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6,
      });

      hands.onResults(onResults);

      navigator.mediaDevices
        .getUserMedia({ video: true })
        .then((stream) => {
          videoElement.srcObject = stream;
          const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
              await hands.send({ image: videoElement });
            },
            width: 480,
            height: 360,
          });
          cameraUtils.start();
        })
        .catch((err) => {
          console.error("Akses kamera ditolak/gagal:", err);
          errorMsg.style.display = "block";
        });
    </script>
  </body>
</html>
